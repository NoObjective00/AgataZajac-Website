<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Orchestras map</title>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; padding: 0; background: #141210; font-family: Archivo, Helvetica, sans-serif; }
  #map { position: relative; width: 100%; }
  svg { display: block; width: 100%; height: auto; }
  #tip {
    position: absolute; pointer-events: none; opacity: 0; transition: opacity 120ms;
    max-width: 300px; padding: 16px 18px; background: rgba(10,9,8,0.96);
    border: 1px solid rgba(195,149,84,0.45); color: #ece7df; z-index: 5;
  }
  #tip .city { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #c39554; margin-bottom: 10px; }
  #tip .orch { font-size: 15px; line-height: 1.35; margin-bottom: 4px; }
  #tip .work { font-size: 12.5px; line-height: 1.45; color: rgba(236,231,223,0.68); margin-bottom: 10px; }
  #tip .orch:last-child, #tip .work:last-child { margin-bottom: 0; }
</style>
</head>
<body>
<div id="map"><div id="tip"></div></div>
<script>
const W = 1000, H = 720;
const cities = [
  { n: "Trondheim", c: [10.40, 63.43], e: [["Trondheim Symphony Orchestra & Opera", "Second Prize, Princess Astrid International Music Competition, 2026"]] },
  { n: "Malmö", c: [13.00, 55.60], e: [["Malmö Opera", ""]] },
  { n: "Dublin", c: [-6.26, 53.35], e: [["National Symphony Orchestra, Ireland", "Viennese and Hungarian operetta, with soprano Ami Hewitt"]] },
  { n: "Manchester", c: [-2.24, 53.48], e: [["The Hallé", "Second Prize and audience vote, Siemens Hallé International Conductors' Competition, 2023"], ["BBC Philharmonic", "Anna Clyne — This Midnight Hour"], ["Manchester Camerata", "Dvořák — Symphony No. 7"], ["Royal Northern College of Music", "Mills Williams Junior Fellow in Conducting"]] },
  { n: "Leicester", c: [-1.13, 52.64], e: [["Bardi Symphony Orchestra", "Bacewicz — Overture; Elgar — Cello Concerto; Sibelius — Symphony No. 5 (Mar 2027)"]] },
  { n: "Cambridge", c: [0.12, 52.20], e: [["Britten Sinfonia", ""]] },
  { n: "London", c: [-0.13, 51.51], e: [["National Youth Orchestra of Great Britain", ""]] },
  { n: "Szczecin", c: [14.55, 53.43], e: [["Szczecin Philharmonic", ""]] },
  { n: "Berlin", c: [13.40, 52.52], e: [["Rundfunk-Sinfonieorchester Berlin", "Singing Christmas – Weihnachtszauber (Dec 2026)"]] },
  { n: "Hamburg", c: [9.99, 53.55], e: [["NDR Elbphilharmonie Orchester", "Conductor Fellow 2024/25, under Alan Gilbert"]] },
  { n: "Hannover", c: [9.73, 52.37], e: [["NDR Radiophilharmonie", "Mendelssohn — Die Hebriden; Schumann — Cello Concerto; Beethoven — Symphony No. 6 (Apr–May 2027)"]] },
  { n: "Toruń", c: [18.60, 53.01], e: [["Toruń Symphony Orchestra", "Resident Conductor"]] },
  { n: "Poznań", c: [16.93, 52.41], e: [["Poznań Philharmonic Orchestra", ""], ["Poznań Academy of Music", "Conducting studies"]] },
  { n: "Warsaw", c: [21.01, 52.23], e: [["Polish Royal Opera, Nowa Miodowa", "Schubert — Winterreise, arr. Matesic (Dec 2026)"], ["Warsaw Chamber Opera", "Assistant conductor: Mozart — Die Entführung aus dem Serail, Idomeneo; Moniuszko — Halka"]] },
  { n: "Leipzig", c: [12.37, 51.34], e: [["Mendelssohn Academy Orchestra", "Augusta Read Thomas — Dance Mobile, Gewandhaus zu Leipzig"]] },
  { n: "Zielona Góra", c: [15.51, 51.94], e: [["Zielona Góra Philharmonic", ""]] },
  { n: "Wałbrzych", c: [16.28, 50.77], e: [["Filharmonia Sudecka", "Resident Conductor. Bach, Barber, Vaughan Williams, Bartók (Oct 2026)"]] },
  { n: "Karlovy Vary", c: [12.87, 50.23], e: [["Karlovy Vary Symphony Orchestra", ""]] },
  { n: "Opole", c: [17.93, 50.67], e: [["Opole Philharmonic", ""]] },
  { n: "Katowice", c: [19.02, 50.26], e: [["Polish National Radio Symphony Orchestra (NOSPR)", "Brahms — Symphony No. 1"]] },
  { n: "Amiens", c: [2.30, 49.89], e: [["Orchestre de Picardie", ""]] },
  { n: "Luxembourg", c: [6.13, 49.61], e: [["Luxembourg Chamber Orchestra", "Laureates Concert (Oct 2026)"]] },
  { n: "Metz", c: [6.18, 49.12], e: [["Orchestre national de Metz", ""]] },
  { n: "Graz", c: [15.44, 47.07], e: [["Grazer Philharmoniker", ""]] },
  { n: "Gstaad", c: [7.29, 46.47], e: [["Gstaad Festival Orchestra", "Gstaad Conducting Academy. Beethoven — Symphony No. 5"]] },
  { n: "Turin", c: [7.69, 45.07], e: [["Turin", "Orchestra to be confirmed"]] },
  { n: "Sanremo", c: [7.78, 43.82], e: [["Orchestra Sinfonica di Sanremo", ""]] },
  { n: "Santiago de Compostela", c: [-8.54, 42.88], e: [["Real Filharmonía de Galicia", ""]] },
  { n: "Barcelona", c: [2.17, 41.39], e: [["Orquesta Sinfónica de Barcelona", "Assistant Conductor to Ludovic Morlot, 2023–25"]] },
  { n: "Istanbul", c: [28.98, 41.01], e: [["Istanbul", "Orchestra to be confirmed"]] },
  { n: "Lisbon", c: [-9.14, 38.72], e: [["Gulbenkian Orchestra", "Mozart, Beethoven, Paradis, Haydn (Feb 2027)"]] },
  { n: "Athens", c: [23.73, 37.98], e: [["Athens Philharmonia", "New Year concert tour, China"], ["Greek National Radio Symphony Orchestra", ""]] },
  { n: "Valletta", c: [14.51, 35.90], e: [["Malta Philharmonic Orchestra", "Special distinction, Malta International Conducting Competition, 2018"]] }
];

const frame = { type: "MultiPoint", coordinates: [[-13, 33], [30, 65.5]] };
const projection = d3.geoMercator().fitExtent([[46, 34], [W - 46, H - 30]], frame);
const path = d3.geoPath(projection);

const container = document.getElementById("map");
const tip = document.getElementById("tip");
const svg = d3.select("#map").append("svg").attr("viewBox", `0 0 ${W} ${H}`);

function showTip(event, d) {
  tip.innerHTML = `<div class="city">${d.n}</div>` + d.e.map(([o, w]) =>
    `<div class="orch">${o}</div>` + (w ? `<div class="work">${w}</div>` : "")).join("");
  tip.style.opacity = 1;
  moveTip(event);
}
function moveTip(event) {
  const r = container.getBoundingClientRect();
  let x = event.clientX - r.left + 18, y = event.clientY - r.top + 14;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  if (x + w > r.width - 8) x = event.clientX - r.left - w - 18;
  if (y + h > r.height - 8) y = Math.max(8, event.clientY - r.top - h - 14);
  tip.style.left = x + "px";
  tip.style.top = y + "px";
}

d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json").then(topology => {
  const countries = topojson.feature(topology, topology.objects.countries);
  svg.append("g").selectAll("path").data(countries.features).join("path")
    .attr("d", path)
    .attr("fill", "#26221d")
    .attr("stroke", "#141210")
    .attr("stroke-width", 1);

  const pins = svg.append("g").selectAll("g").data(cities).join("g")
    .attr("transform", d => `translate(${projection(d.c).join(",")})`)
    .style("cursor", "pointer")
    .on("mouseenter", showTip)
    .on("mousemove", moveTip)
    .on("mouseleave", () => { tip.style.opacity = 0; });

  pins.append("circle").attr("r", 16).attr("fill", "transparent");
  pins.append("circle").attr("class", "halo").attr("r", 11).attr("fill", "#c39554").attr("opacity", 0.14);
  pins.append("circle").attr("r", 4).attr("fill", "#c39554");
  pins.on("mouseenter.style", function () { d3.select(this).select(".halo").attr("r", 16).attr("opacity", 0.3); })
      .on("mouseleave.style", function () { d3.select(this).select(".halo").attr("r", 11).attr("opacity", 0.14); });
});
</script>
</body>
</html>
